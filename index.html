<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHINAPROFITHUB — Launching Soon</title>
  <link rel="icon" type="image/png" href="favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#222 0%,#0b0b0b 45%,#000 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.container{width:90%;max-width:1200px;text-align:center}
.brand{font-size:clamp(3rem,8vw,8rem);font-weight:900;letter-spacing:-4px;line-height:.95;text-transform:uppercase}
.launching{margin-top:35px;font-size:clamp(1.2rem,2.5vw,2rem);font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#bdbdbd}
.date{margin-top:12px;font-size:clamp(2rem,5vw,4rem);font-weight:900;letter-spacing:3px}
.countdown{margin-top:45px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.time-box{min-width:110px;padding:20px 15px;border:1px solid #333;border-radius:14px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}
.number{font-size:2.5rem;font-weight:800}.label{margin-top:5px;font-size:.7rem;letter-spacing:2px;color:#888}
.footer{margin-top:55px;font-size:.75rem;letter-spacing:3px;color:#666;text-transform:uppercase}
@media(max-width:600px){.brand{letter-spacing:-2px}.launching{letter-spacing:3px}.countdown{gap:8px}.time-box{min-width:75px;padding:15px 8px}.number{font-size:1.7rem}}
</style>
</head>
<body>
<main class="container">
<div class="brand">CHINAPROFITHUB</div>
<div class="launching">Launching On</div>
<div class="date">01 / 09 / 2026</div>
<div class="countdown">
<div class="time-box"><div class="number" id="days">00</div><div class="label">DAYS</div></div>
<div class="time-box"><div class="number" id="hours">00</div><div class="label">HOURS</div></div>
<div class="time-box"><div class="number" id="minutes">00</div><div class="label">MINUTES</div></div>
<div class="time-box"><div class="number" id="seconds">00</div><div class="label">SECONDS</div></div>
</div>
<div class="footer">Something new is coming.</div>
</main>
<script>
const launchDate=new Date("September 1, 2026 00:00:00 GMT+0530").getTime();
function updateCountdown(){const now=Date.now(),difference=launchDate-now;if(difference<=0){['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='00');return}const days=Math.floor(difference/86400000),hours=Math.floor(difference%86400000/3600000),minutes=Math.floor(difference%3600000/60000),seconds=Math.floor(difference%60000/1000);document.getElementById('days').textContent=String(days).padStart(2,'0');document.getElementById('hours').textContent=String(hours).padStart(2,'0');document.getElementById('minutes').textContent=String(minutes).padStart(2,'0');document.getElementById('seconds').textContent=String(seconds).padStart(2,'0')}
updateCountdown();setInterval(updateCountdown,1000);
</script>
</body>
</html>
